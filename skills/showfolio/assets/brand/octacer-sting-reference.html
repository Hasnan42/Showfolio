</svg><div class="eb" id="eb">BUILT BY OCTACER</div>
<script>
const mark=document.querySelector('.mark'),ltr=[...document.querySelectorAll('.ltr')],eb=document.getElementById('eb');
mark.style.strokeDasharray=1;
const ease=x=>1-Math.pow(1-x,3),cl=x=>Math.max(0,Math.min(1,x));
window.seek=t=>{ // pure function of time t (seconds): mark draws 0-0.9s, letters 0.7-1.3s, eyebrow 1.3-1.7s, hold to ~2.2s
  mark.style.strokeDashoffset=1-ease(cl(t/0.9));
  ltr.forEach((p,i)=>{const k=ease(cl((t-0.7-i*0.05)/0.35));p.style.opacity=k;p.style.transform='translateY('+(1-k)*6+'px)'});
  eb.style.opacity=ease(cl((t-1.3)/0.4));
};seek(0);
</script></body></html>
